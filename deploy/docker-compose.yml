# Producción: PostgreSQL + migraciones + app Next.js + Caddy (HTTPS).
# Uso: ver deploy/DEPLOY.md. Lee las variables de deploy/.env.
name: thesparkindex

x-app-env: &app-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    # Publicado SOLO en 127.0.0.1 del servidor: lo usa el build de Next.js.
    # No es accesible desde internet.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Aplica migraciones y termina. También sirve para correr el seed:
  #   docker compose run --rm migrate npx prisma db seed
  migrate:
    <<: *app-env
    build:
      context: ..
      target: tools
    image: thesparkindex-tools
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/storage/uploads

  app:
    <<: *app-env
    build:
      context: ..
      target: runner
      # El build prerenderiza páginas con datos: se conecta a la base por 127.0.0.1.
      network: host
      args:
        DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:${DB_HOST_PORT:-5432}/${POSTGRES_DB}?schema=public
    image: thesparkindex-app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/app/storage/uploads

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
